# Builds unsigned Linux and macOS Tauri setup installers with bundled bootstrap tools.

name: Build Unix Installers

on:
    workflow_dispatch:
        inputs:
            linux-audited-archive:
                description: Optional Linux bootstrap archive, in NAME=HTTPS_URL=SHA256 form.
                required: false
                type: string
            macos-audited-archive:
                description: Optional macOS bootstrap archive, in NAME=HTTPS_URL=SHA256 form.
                required: false
                type: string

permissions:
    contents: read

jobs:
    authorize:
        name: Authorize (admins only)
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Check actor is a repo admin
              env:
                  GH_TOKEN: ${{ github.token }}
                  ACTOR: ${{ github.actor }}
              run: |
                  set -euo pipefail
                  perm=$(gh api \
                      "repos/${{ github.repository }}/collaborators/${ACTOR}/permission" \
                      --jq '.permission')
                  echo "Actor '${ACTOR}' has permission: ${perm}"
                  if [ "${perm}" != "admin" ]; then
                      echo "::error::'${ACTOR}' is not a repo admin (permission=${perm}). Refusing to build."
                      exit 1
                  fi
                  echo "Authorized: '${ACTOR}' is an admin."

    build:
        name: ${{ matrix.name }}
        needs: authorize
        runs-on: ${{ matrix.os }}
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: Hermes-Setup Linux
                      os: ubuntu-latest
                      platform: linux
                      artifact-name: Hermes-Setup-linux
                      artifact-path: |
                          apps/bootstrap-installer/src-tauri/target/release/bundle/appimage/*.AppImage
                    - name: Hermes-Setup macOS
                      os: macos-latest
                      platform: macos
                      artifact-name: Hermes-Setup-macos
                      artifact-path: |
                          apps/bootstrap-installer/src-tauri/target/release/bundle/dmg/*.dmg
                          apps/bootstrap-installer/src-tauri/target/release/bundle/macos/*.app

        steps:
            - name: Checkout code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
              with:
                  node-version: 22
                  cache: npm

            - name: Setup Python
              uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6
              with:
                  python-version: "3.11"
                  cache: pip

            - name: Install npm dependencies
              run: npm ci

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

            - name: Cache Rust targets
              uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
              with:
                  workspaces: apps/bootstrap-installer/src-tauri

            - name: Install Linux Tauri dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                      build-essential \
                      curl \
                      file \
                      libayatana-appindicator3-dev \
                      librsvg2-dev \
                      libssl-dev \
                      libwebkit2gtk-4.1-dev \
                      libxdo-dev \
                      patchelf \
                      wget

            - name: Bundle bootstrap tool archives
              env:
                  HERMES_LINUX_AUDITED_ARCHIVE: ${{ inputs['linux-audited-archive'] }}
                  HERMES_MACOS_AUDITED_ARCHIVE: ${{ inputs['macos-audited-archive'] }}
              run: |
                  set -euo pipefail
                  HERMES_AUDITED_ARCHIVE=""
                  if [ "${{ matrix.platform }}" = "linux" ]; then
                      HERMES_AUDITED_ARCHIVE="${HERMES_LINUX_AUDITED_ARCHIVE}"
                  else
                      HERMES_AUDITED_ARCHIVE="${HERMES_MACOS_AUDITED_ARCHIVE}"
                  fi
                  args=(
                      scripts/prepare_bootstrap_tools.py
                      --platform "${{ matrix.platform }}"
                      --arch "${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}"
                      --bundle-playwright-browsers
                      --bundle-electron-cache
                      --bundle-npm-cache
                  )
                  if [ -n "${HERMES_AUDITED_ARCHIVE}" ]; then
                      args+=(--audited-archive "${HERMES_AUDITED_ARCHIVE}")
                  fi
                  python "${args[@]}"

            - name: Validate bootstrap tool archives
              run: >
                  python scripts/prepare_bootstrap_tools.py
                  --validate-only
                  --platform ${{ matrix.platform }}
                  --arch ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}

            - name: Bundle Python wheelhouse
              run: >
                  python scripts/prepare_python_wheelhouse.py
                  --platform ${{ matrix.platform }}
                  --arch ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
                  --python python
                  --force

            - name: Validate Python wheelhouse
              run: >
                  python scripts/prepare_python_wheelhouse.py
                  --validate-only
                  --platform ${{ matrix.platform }}
                  --arch ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}

            - name: Build installer
              env:
                  HERMES_BUILD_PIN_COMMIT: ${{ github.sha }}
              run: npm run tauri:build
              working-directory: apps/bootstrap-installer

            - name: Smoke built installer binary
              run: >
                  ./apps/bootstrap-installer/src-tauri/target/release/Hermes-Setup --self-check
                  --self-check-expect-commit "${{ github.sha }}"
                  --self-check-bootstrap-tools apps/bootstrap-installer/src-tauri/bootstrap-tools
                  --self-check-bootstrap-tools-platform ${{ matrix.platform }}
                  --self-check-bootstrap-tools-arch ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
                  --self-check-wheelhouse apps/bootstrap-installer/src-tauri/wheelhouse
                  --self-check-wheelhouse-platform ${{ matrix.platform }}
                  --self-check-wheelhouse-arch ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}

            - name: Smoke built installer lifecycle
              run: >
                  ./apps/bootstrap-installer/src-tauri/target/release/Hermes-Setup --self-check-lifecycle
                  --self-check-expect-commit "${{ github.sha }}"
                  --self-check-bootstrap-tools apps/bootstrap-installer/src-tauri/bootstrap-tools
                  --self-check-bootstrap-tools-platform ${{ matrix.platform }}
                  --self-check-bootstrap-tools-arch ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
                  --self-check-wheelhouse apps/bootstrap-installer/src-tauri/wheelhouse
                  --self-check-wheelhouse-platform ${{ matrix.platform }}
                  --self-check-wheelhouse-arch ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}

            - name: Smoke packaged Linux AppImage lifecycle
              if: matrix.platform == 'linux'
              env:
                  APPIMAGE_EXTRACT_AND_RUN: 1
              run: |
                  set -euo pipefail
                  appimage="$(
                      find apps/bootstrap-installer/src-tauri/target/release/bundle/appimage \
                          -maxdepth 1 -name '*.AppImage' -print -quit
                  )"
                  test -n "${appimage}"
                  chmod +x "${appimage}"
                  "${appimage}" --self-check \
                      --self-check-expect-commit "${{ github.sha }}" \
                      --self-check-bootstrap-tools apps/bootstrap-installer/src-tauri/bootstrap-tools \
                      --self-check-bootstrap-tools-platform ${{ matrix.platform }} \
                      --self-check-bootstrap-tools-arch ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }} \
                      --self-check-wheelhouse apps/bootstrap-installer/src-tauri/wheelhouse \
                      --self-check-wheelhouse-platform ${{ matrix.platform }} \
                      --self-check-wheelhouse-arch ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
                  "${appimage}" --self-check-lifecycle \
                      --self-check-expect-commit "${{ github.sha }}" \
                      --self-check-bootstrap-tools apps/bootstrap-installer/src-tauri/bootstrap-tools \
                      --self-check-bootstrap-tools-platform ${{ matrix.platform }} \
                      --self-check-bootstrap-tools-arch ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }} \
                      --self-check-wheelhouse apps/bootstrap-installer/src-tauri/wheelhouse \
                      --self-check-wheelhouse-platform ${{ matrix.platform }} \
                      --self-check-wheelhouse-arch ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}

            - name: Smoke packaged macOS app lifecycle
              if: matrix.platform == 'macos'
              run: |
                  set -euo pipefail
                  app_bin="$(
                      find apps/bootstrap-installer/src-tauri/target/release/bundle/macos \
                          -path '*/Contents/MacOS/Hermes' -type f -print -quit
                  )"
                  test -n "${app_bin}"
                  "${app_bin}" --self-check \
                      --self-check-expect-commit "${{ github.sha }}" \
                      --self-check-bootstrap-tools apps/bootstrap-installer/src-tauri/bootstrap-tools \
                      --self-check-bootstrap-tools-platform ${{ matrix.platform }} \
                      --self-check-bootstrap-tools-arch ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }} \
                      --self-check-wheelhouse apps/bootstrap-installer/src-tauri/wheelhouse \
                      --self-check-wheelhouse-platform ${{ matrix.platform }} \
                      --self-check-wheelhouse-arch ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
                  "${app_bin}" --self-check-lifecycle \
                      --self-check-expect-commit "${{ github.sha }}" \
                      --self-check-bootstrap-tools apps/bootstrap-installer/src-tauri/bootstrap-tools \
                      --self-check-bootstrap-tools-platform ${{ matrix.platform }} \
                      --self-check-bootstrap-tools-arch ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }} \
                      --self-check-wheelhouse apps/bootstrap-installer/src-tauri/wheelhouse \
                      --self-check-wheelhouse-platform ${{ matrix.platform }} \
                      --self-check-wheelhouse-arch ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}

            - name: Validate Linux installer artifacts
              if: matrix.platform == 'linux'
              run: >
                  python scripts/validate_installer_artifacts.py
                  --artifact "apps/bootstrap-installer/src-tauri/target/release/bundle/appimage/*.AppImage"
                  --artifact "apps/bootstrap-installer/src-tauri/bootstrap-tools/bootstrap-tools-manifest.json"
                  --artifact "apps/bootstrap-installer/src-tauri/wheelhouse/wheelhouse-manifest.json"
                  --bootstrap-tools-dir apps/bootstrap-installer/src-tauri/bootstrap-tools
                  --bootstrap-tools-platform ${{ matrix.platform }}
                  --bootstrap-tools-arch ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
                  --wheelhouse-dir apps/bootstrap-installer/src-tauri/wheelhouse
                  --wheelhouse-platform ${{ matrix.platform }}
                  --wheelhouse-arch ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}

            - name: Validate macOS installer artifacts
              if: matrix.platform == 'macos'
              run: >
                  python scripts/validate_installer_artifacts.py
                  --artifact "apps/bootstrap-installer/src-tauri/target/release/bundle/dmg/*.dmg"
                  --artifact "apps/bootstrap-installer/src-tauri/target/release/bundle/macos/*.app"
                  --artifact "apps/bootstrap-installer/src-tauri/bootstrap-tools/bootstrap-tools-manifest.json"
                  --artifact "apps/bootstrap-installer/src-tauri/wheelhouse/wheelhouse-manifest.json"
                  --bootstrap-tools-dir apps/bootstrap-installer/src-tauri/bootstrap-tools
                  --bootstrap-tools-platform ${{ matrix.platform }}
                  --bootstrap-tools-arch ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
                  --wheelhouse-dir apps/bootstrap-installer/src-tauri/wheelhouse
                  --wheelhouse-platform ${{ matrix.platform }}
                  --wheelhouse-arch ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}

            - name: Upload installer artifacts
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
              with:
                  name: ${{ matrix.artifact-name }}
                  path: ${{ matrix.artifact-path }}
                  if-no-files-found: error

            - name: Upload bootstrap tools manifest
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
              with:
                  name: ${{ matrix.artifact-name }}-bootstrap-tools-manifest
                  path: apps/bootstrap-installer/src-tauri/bootstrap-tools/bootstrap-tools-manifest.json
                  if-no-files-found: error

            - name: Upload bootstrap tool archives
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
              with:
                  name: ${{ matrix.artifact-name }}-bootstrap-tools
                  path: apps/bootstrap-installer/src-tauri/bootstrap-tools/*.tar.gz
                  if-no-files-found: error

            - name: Upload Python wheelhouse
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
              with:
                  name: ${{ matrix.artifact-name }}-python-wheelhouse
                  path: |
                      apps/bootstrap-installer/src-tauri/wheelhouse/*.whl
                      apps/bootstrap-installer/src-tauri/wheelhouse/wheelhouse-manifest.json
                  if-no-files-found: error
