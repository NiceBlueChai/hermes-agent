name: Build Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Gate: workflow_dispatch is already restricted to users with write access,
  # but we want ADMIN-only. Explicitly check the triggering actor's repo
  # permission via the API and fail fast for anyone below admin.
  authorize:
    name: Authorize (admins only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check actor is a repo admin
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          perm=$(gh api \
            "repos/${{ github.repository }}/collaborators/${ACTOR}/permission" \
            --jq '.permission')
          echo "Actor '${ACTOR}' has permission: ${perm}"
          if [ "${perm}" != "admin" ]; then
            echo "::error::'${ACTOR}' is not a repo admin (permission=${perm}). Refusing to build/sign."
            exit 1
          fi
          echo "Authorized: '${ACTOR}' is an admin."

  build:
    name: Hermes-Setup.exe
    needs: authorize
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Required for OIDC auth to Azure (azure/login federated credentials).
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Cache Rust targets
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          workspaces: apps/bootstrap-installer/src-tauri

      - name: Bundle bootstrap tool archives
        run: python scripts/prepare_bootstrap_tools.py --arch x64

      - name: Validate bootstrap tool archives
        run: >
          python scripts/prepare_bootstrap_tools.py
          --validate-only
          --platform windows
          --arch x64

      - name: Bundle Python wheelhouse
        run: >
          python scripts/prepare_python_wheelhouse.py
          --platform windows
          --arch x64
          --python python
          --force

      - name: Validate Python wheelhouse
        run: >
          python scripts/prepare_python_wheelhouse.py
          --validate-only
          --platform windows
          --arch x64

      - name: Build installer
        env:
          HERMES_BUILD_PIN_COMMIT: ${{ github.sha }}
        run: npm run tauri:build
        working-directory: apps/bootstrap-installer

      - name: Azure login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5  # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Hermes-Setup.exe with Azure Artifact Signing
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82  # v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_CERTIFICATE_PROFILE }}
          # Sign both the raw exe and the bundled NSIS installer.
          files-folder: ${{ github.workspace }}\apps\bootstrap-installer\src-tauri\target\release
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Smoke built installer binary
        run: >
          .\apps\bootstrap-installer\src-tauri\target\release\Hermes-Setup.exe --self-check
          --self-check-expect-commit "${{ github.sha }}"
          --self-check-bootstrap-tools apps/bootstrap-installer/src-tauri/bootstrap-tools
          --self-check-bootstrap-tools-platform windows
          --self-check-bootstrap-tools-arch x64
          --self-check-wheelhouse apps/bootstrap-installer/src-tauri/wheelhouse
          --self-check-wheelhouse-platform windows
          --self-check-wheelhouse-arch x64

      - name: Validate installer artifacts
        run: >
          python scripts/validate_installer_artifacts.py
          --artifact "apps/bootstrap-installer/src-tauri/target/release/Hermes-Setup.exe"
          --artifact "apps/bootstrap-installer/src-tauri/target/release/bundle/nsis/*.exe"
          --artifact "apps/bootstrap-installer/src-tauri/bootstrap-tools/bootstrap-tools-manifest.json"
          --artifact "apps/bootstrap-installer/src-tauri/wheelhouse/wheelhouse-manifest.json"
          --bootstrap-tools-dir apps/bootstrap-installer/src-tauri/bootstrap-tools
          --bootstrap-tools-platform windows
          --bootstrap-tools-arch x64
          --wheelhouse-dir apps/bootstrap-installer/src-tauri/wheelhouse
          --wheelhouse-platform windows
          --wheelhouse-arch x64

      - name: Upload NSIS installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: Hermes-Setup-installer
          path: apps/bootstrap-installer/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload raw exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: Hermes-Setup-exe
          path: apps/bootstrap-installer/src-tauri/target/release/Hermes-Setup.exe
          if-no-files-found: error

      - name: Upload bootstrap tools manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: Hermes-Setup-bootstrap-tools-manifest
          path: apps/bootstrap-installer/src-tauri/bootstrap-tools/bootstrap-tools-manifest.json
          if-no-files-found: error

      - name: Upload bootstrap tool archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: Hermes-Setup-bootstrap-tools
          path: |
            apps/bootstrap-installer/src-tauri/bootstrap-tools/*.zip
            apps/bootstrap-installer/src-tauri/bootstrap-tools/*.7z.exe
          if-no-files-found: error

      - name: Upload Python wheelhouse
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: Hermes-Setup-python-wheelhouse
          path: |
            apps/bootstrap-installer/src-tauri/wheelhouse/*.whl
            apps/bootstrap-installer/src-tauri/wheelhouse/wheelhouse-manifest.json
          if-no-files-found: error
